# Render Blueprint — one web service hosts the MERA PWA and its small API.
# Connect the GitHub repo in Render (New → Blueprint); nothing else is manual.
services:
  - type: web
    name: mera
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      # Local Gemma runs in each visitor's browser; nothing to configure server-side.
      - key: ENABLE_LOCAL_AI
        value: "true"
      # Connected AI (opt-in for visitors): Gemma on Google AI Studio's OpenAI-compatible endpoint.
      # Stays off until MODEL_API_KEY is set (the server won't advertise it without a key).
      - key: ENABLE_REMOTE_AI
        value: "true"
      - key: MODEL_MODE
        value: local-first
      - key: MODEL_PROVIDER
        value: openai
      - key: MODEL_ENDPOINT
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: MODEL_NAME
        value: gemma-3-27b-it
      # Secret: a free Google AI Studio key (aistudio.google.com/apikey). Set it in the Render dashboard; never commit it.
      - key: MODEL_API_KEY
        sync: false
      - key: REMOTE_AI_RATE_LIMIT
        value: "40"
